<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#20242b; --ink2:#6a7280; --ink3:#9aa0ab; --line:#e3e6ec;
  --bg:#f3f4f8; --paper:#ffffff;
  --star:#e0a527; --danger:#c0392b; --ok:#2f8a52;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overscroll-behavior-y:none;}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,sans-serif;font-size:15px;line-height:1.6;}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,textarea,select{font-family:inherit;font-size:14px;}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}

.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;}
.topbar .back{width:34px;height:34px;border-radius:10px;background:#f2f3f6;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink2);flex:0 0 auto;}
.topbar .back:hover{background:#e7e9ee;}
.topbar .ttl{flex:1;font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .ttl small{display:block;font-weight:600;font-size:11px;color:var(--ink2);}
.topbar .icon-btn{width:34px;height:34px;border-radius:10px;background:#f2f3f6;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;}
.topbar .icon-btn:hover{background:#e7e9ee;}

.content{flex:1;padding:14px 16px 90px;}

/* course/case list tiles */
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(20,24,40,.03);}
.tile:active{transform:scale(.99);}
.tile .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
.tile .body{flex:1;min-width:0;}
.tile .name{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tile .meta{font-size:11.5px;color:var(--ink2);margin-top:2px;}
.tile .chev{color:var(--ink3);font-size:16px;}
.tile .kebab{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:16px;flex:0 0 auto;}
.tile .kebab:hover{background:#f2f3f6;}

.section-title{font-size:11.5px;font-weight:800;color:var(--ink2);letter-spacing:.04em;margin:18px 0 8px 4px;}
.section-title:first-child{margin-top:0;}

.empty{text-align:center;padding:40px 20px;color:var(--ink2);font-size:13px;}
.empty .big{font-size:36px;margin-bottom:8px;}

/* card row (inside a case) */
.crow{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;}
.crow .txt{flex:1;min-width:0;font-size:13.2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.crow .star-btn{flex:0 0 auto;font-size:17px;color:#d8dbe1;}
.crow .star-btn.on{color:var(--star);}
.crow .edit-btn{flex:0 0 auto;font-size:14px;color:var(--ink3);width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.crow .edit-btn:hover{background:#f2f3f6;}

/* top actions row */
.actions-row{display:flex;gap:8px;margin-bottom:16px;}
.act-btn{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink);}
.act-btn .n{display:block;font-size:19px;margin-bottom:2px;}
.act-btn:active{background:#f2f3f6;}
.act-btn.primary{background:var(--course-color, #1f4e8c);border-color:var(--course-color, #1f4e8c);color:#fff;}

/* FAB */
.fab{position:fixed;bottom:22px;left:50%;transform:translateX(calc(-50% + 230px));width:54px;height:54px;border-radius:50%;background:var(--ink);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(20,24,40,.3);z-index:30;}
.fab:active{transform:translateX(calc(-50% + 230px)) scale(.94);}
@media (max-width:560px){ .fab{ right:20px; left:auto; transform:none; } .fab:active{ transform:scale(.94); } }

/* modal / sheet */
.overlay{position:fixed;inset:0;background:rgba(20,24,40,.4);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:18px 18px 24px;}
.sheet-hd{display:flex;align-items:center;margin-bottom:14px;}
.sheet-hd h3{flex:1;font-size:16px;}
.sheet-hd .x{width:30px;height:30px;border-radius:9px;background:#f2f3f6;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink2);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:6px;}
.field input[type=text], .field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);background:#fbfbfd;}
.field textarea{min-height:90px;resize:vertical;line-height:1.55;}
.field textarea.tall{min-height:140px;}
.swatches{display:flex;flex-wrap:wrap;gap:8px;}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;}
.sw.sel{border-color:var(--ink);}
.sheet-btns{display:flex;gap:8px;margin-top:6px;}
.sheet-btns button{flex:1;border-radius:12px;padding:12px;font-weight:800;font-size:13.5px;}
.btn-secondary{background:#f2f3f6;color:var(--ink);}
.btn-primary{background:var(--ink);color:#fff;}
.btn-danger{background:#fdecec;color:var(--danger);}

/* study mode */
.study-progress{font-size:12px;color:var(--ink2);font-weight:700;display:flex;justify-content:space-between;margin-bottom:8px;}
.study-bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px;}
.study-bar .fill{height:100%;background:var(--course-color,#1f4e8c);transition:width .2s;}
.stage{perspective:1600px;margin-bottom:14px;touch-action:pan-y;}
.card3d{position:relative;width:100%;min-height:320px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1);}
.card3d.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 16px rgba(20,24,40,.08);padding:22px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;}
.face.back{transform:rotateY(180deg);}
.face-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.face-tag{font-size:10px;font-weight:800;color:#b7bec9;letter-spacing:.05em;}
.face .star-btn{font-size:19px;color:#d8dbe1;}
.face .star-btn.on{color:var(--star);}
.face-content{flex:1;display:flex;align-items:center;}
.front .face-content{justify-content:center;text-align:center;}
.front .txt{font-size:17px;font-weight:600;white-space:pre-wrap;line-height:1.6;color:var(--ink);}
.back .txt{font-size:13.8px;white-space:pre-wrap;line-height:1.7;}
.tap-hint{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:10px;}
.nav-row{display:flex;align-items:center;gap:10px;}
.nav-btn{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:12px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--ink);}
.nav-btn:disabled{opacity:.3;}
.flip-btn{flex:1;border:1px solid var(--course-color,#1f4e8c);background:var(--course-color,#1f4e8c);color:#fff;border-radius:12px;height:48px;font-weight:800;font-size:13.5px;}
.review-row{display:flex;gap:8px;margin-top:10px;}
.review-row button{flex:1;border-radius:12px;padding:11px;font-weight:800;font-size:12.5px;}
.rb-know{background:var(--ok-soft,#e6f5ea);color:var(--ok);}
.rb-unsure{background:#fff4d6;color:#8a6415;}

.settings-row{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.settings-row .ic{font-size:18px;flex:0 0 auto;}
.settings-row .lbl{flex:1;font-size:13.5px;font-weight:700;}
.settings-row .lbl small{display:block;font-weight:500;color:var(--ink2);font-size:11.5px;margin-top:1px;}
input[type=file]{display:none;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:700;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

/* section header with action button (reorder toggle etc.) */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px 2px;}
.section-hd .section-title{margin:0;}
.reorder-toggle{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px;}
.reorder-toggle:hover{border-color:var(--c,#5b3d8f);color:var(--c,#5b3d8f);}
.reorder-toggle.active{background:var(--ink);border-color:var(--ink);color:#fff;}

/* reorder mode rows */
.rtile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;height:48px;touch-action:none;user-select:none;-webkit-user-select:none;}
.rtile .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.rtile .name{flex:1;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rtile .drag-handle{flex:0 0 auto;font-size:18px;color:var(--ink3);padding:6px 4px;cursor:grab;touch-action:none;}
.rtile.dragging{box-shadow:0 8px 20px rgba(20,24,40,.18);z-index:60;background:#faf9ff;}

/* shuffle toggle */
.shuffle-row{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;font-weight:700;color:var(--ink);}
.shuffle-sw{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;}
.shuffle-sw:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
.shuffle-sw.on{background:var(--course-color,#5b3d8f);}
.shuffle-sw.on:after{left:18px;}

/* dictionary lookup */
.lookup-btn{position:fixed;z-index:150;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.25);display:none;align-items:center;gap:6px;}
.lookup-btn.show{display:flex;}
.lookup-sheet-hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.lookup-word{font-size:19px;font-weight:800;color:var(--ink);flex:1;}
.lookup-phon{font-size:12.5px;color:var(--ink2);margin-top:2px;}
.lookup-sec{margin-bottom:14px;}
.lookup-sec .lbl{font-size:10.5px;font-weight:800;color:var(--ink2);letter-spacing:.04em;margin-bottom:6px;}
.lookup-pos{display:inline-block;font-size:10.5px;font-weight:800;background:#f2f3f6;color:var(--ink2);border-radius:6px;padding:2px 8px;margin-bottom:5px;}
.lookup-def{font-size:13px;margin:0 0 6px;padding-left:14px;position:relative;}
.lookup-def:before{content:"•";position:absolute;left:0;color:var(--ink3);}
.lookup-kr{font-size:14px;background:#f7f4ff;border-radius:10px;padding:11px 13px;}
.lookup-loading{text-align:center;padding:24px 0;color:var(--ink2);font-size:12.5px;}
.lookup-loading .spin{width:28px;height:28px;border:3px solid #e7e3f5;border-top-color:var(--ink);border-radius:50%;margin:0 auto 10px;animation:lspin .8s linear infinite;}
@keyframes lspin{to{transform:rotate(360deg);}}
.lookup-error{text-align:center;padding:20px 0;color:var(--ink2);font-size:12.5px;}

/* search */
.search-input{flex:1;border:1px solid var(--line);background:#f2f3f6;border-radius:11px;padding:9px 14px;font-size:14px;color:var(--ink);}
.search-input:focus{outline:none;border-color:var(--ink);background:#fff;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<button class="lookup-btn" id="lookupBtn">📖 사전 보기</button>
<div class="overlay" id="lookupOverlay"><div class="sheet" id="lookupSheet"></div></div>

<script>
/* ============ STORAGE ============ */
const STORE_KEY = 'cho_cuecards_app_v1';
const COLOR_PRESETS = ['#5b3d8f','#1f4e8c','#1f8a7a','#b5651d','#a3456b','#2f8a52','#9c3a54','#565d6b'];

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return seedState();
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ toast('저장 실패 — 브라우저 저장공간을 확인해주세요'); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function seedState(){
  const contracts = uid(), civpro = uid(), torts = uid(), lawyering = uid(), mrfl = uid();
  const dio = uid(), con = uid(), swi = uid(), big = uid();
  const c = (courseId, caseId, front, back) => ({id:uid(), courseId, caseId, front, back, starred:false, createdAt:Date.now()});
  return {
    courses:[
      {id:contracts, name:'Contracts', color:'#5b3d8f'},
      {id:civpro, name:'Civil Procedure', color:'#1f4e8c'},
      {id:torts, name:'Torts', color:'#1f8a7a'},
      {id:lawyering, name:'Lawyering Skills', color:'#b5651d'},
      {id:mrfl, name:'MRFL', color:'#a3456b'},
    ],
    cases:[
      {id:dio, courseId:civpro, name:'Dioguardi v. Durning'},
      {id:con, courseId:civpro, name:'Conley v. Gibson'},
      {id:swi, courseId:civpro, name:'Swierkiewicz v. Sorema'},
      {id:big, courseId:civpro, name:'Big Picture'},
    ],
    cards:[
      c(civpro,dio,'Dioguardi v. Durning — what happened?','Plaintiff John Dioguardi, appearing pro se with an "obviously home drawn" complaint, sued the Collector of Customs at the Port of New York over importing merchandise from Italy — bottles of "tonics." He alleged that at a public customs auction, his merchandise was sold to another bidder even though he\'d matched the price ($110), and that two cases of bottles disappeared three weeks before the sale. He also claimed the Collector denied his refund request. He sought $5,000 in damages.\n\n(원고 Dioguardi가 직접 작성한 소장으로 세관장을 상대로 소송 — 경매에서 같은 가격을 불렀는데도 물건이 다른 사람에게 넘어갔고, 병 두 상자가 사라졌다고 주장. $5,000 청구.)'),
      c(civpro,dio,'Trace this case through the courts, step by step.','1. District Court dismisses original complaint, WITH LEAVE to amend (ground: fails to state "facts sufficient to constitute a cause of action" — old code-pleading standard)\n2. Dioguardi files an amended complaint\n3. District Court dismisses AGAIN — this time a final judgment, same ground\n4. Dioguardi appeals to the Second Circuit\n5. Second Circuit REVERSES and remands\n\n(1심 기각(수정 기회 부여) → 수정 소장 제출 → 1심 재기각(확정판결) → 항소 → 항소법원 파기환송)'),
      c(civpro,dio,"What's the core holding (Rule)?",'Under the Federal Rules there is NO requirement to state "facts sufficient to constitute a cause of action" — that\'s the old code-pleading standard the district court mistakenly kept applying. Rule 8(a) only requires "a short and plain statement of the claim showing that the pleader is entitled to relief." Rule 12(b) is for failure to state "a claim upon which relief can be granted" — a different, more forgiving question.\n\n(연방규칙은 "소인을 구성하는 사실"을 요구하지 않음 — Rule 8(a)는 짧고 명확한 진술만 요구)'),
      c(civpro,dio,'Why did the court rule this way? (Reasoning)','Even though "inartistically" drafted, the court gave plaintiff "the benefit of reasonable intendments" and found he\'d disclosed enough — that the Collector converted or disposed of two cases of tonics, and sold the rest inconsistently with the announced auction. Defendant didn\'t have to attack the complaint alone — could\'ve used a pretrial hearing or summary judgment instead. Court also flagged plaintiff\'s limited English — he\'d need legal help to survive something like summary judgment, though declining help was his privilege.\n\n(서투르게 작성됐어도 "합리적 취지의 이익"을 부여받음; 피고는 소장 공격 대신 다른 방법도 있었음; 원고의 영어 실력 관련 우려 언급)'),
      c(civpro,dio,'질문 1: Dioguardi가 실제로 소장에 어떤 사실을 주장했는지, 법적 이론을 명확히 제시했는지, Clark 판사가 인정한 conversion 청구가 소장에 명시적으로 쓰여 있었는지, 항소법원이 어떤 근거로 추론했는지, 그리고 McCaskill의 비판 내용을 묻는 질문.','Dioguardi\'s complaint never used legal terms like "conversion" — it just described events in plain language. It didn\'t articulate a clear legal theory at all. The Second Circuit INFERRED the conversion theory itself, giving the pro se plaintiff "the benefit of reasonable intendments." That\'s exactly why McCaskill criticized the decision — arguing it let almost any complaint survive dismissal, undermining pleading\'s screening function.'),
      c(civpro,dio,'질문 2: 만약 code jurisdiction(사실주의 소송법)에서 재판됐다면 어떻게 됐을지.','The complaint likely would have been dismissed — exactly what the district court did twice under that older standard. It was vague, lacked a clear legal theory, and required inference from disorganized language. Code pleading demanded far more precision than Rule 8(a)\'s notice pleading — this case is a contrast piece between the two systems.'),
      c(civpro,dio,'질문 3: pleading의 burden(주장책임)이 누구에게 있는지, 순환논리처럼 보이지 않는지.','The burden of pleading is generally assigned to whoever has the burden of proof on that issue. Plaintiff\'s burden → must plead it or risk dismissal. Defendant\'s burden (affirmative defense) → must raise it or be barred at trial. It can feel circular since courts just say "plead what\'s essential" without defining essential independently. Plaintiff does NOT need to negate every possible defense — that\'s defendant\'s job under Rule 8(c).'),
      c(civpro,dio,'질문 4: 소각하 신청을 이겨냈다는 게 곧 승소를 의미하는지.','No — surviving a motion to dismiss only means plaintiff met the burden of pleading. The case moves to discovery and eventual resolution on the merits. Dioguardi still had to prove his claims — he just earned the chance to try.'),

      c(civpro,con,'Conley v. Gibson — what was this case about?','A group of Black railroad workers sued their union, alleging discrimination in violation of the duty of fair representation under the Railway Labor Act. Became one of the most-cited statements of the federal notice-pleading standard.\n\n(흑인 철도 노동자들이 노조의 공정대표의무 위반을 이유로 소송)'),
      c(civpro,con,'What\'s the single most famous line from this case?','"...a complaint should not be dismissed for failure to state a claim unless it appears beyond doubt that the plaintiff can prove no set of facts in support of his claim which would entitle him to relief."\n\nThis became the "no set of facts" test — for decades, the standard formula for how forgiving Rule 8(a) really is.'),
      c(civpro,con,'Why did the Court adopt such a forgiving standard?','The Federal Rules only require "a short and plain statement" giving fair notice — not detailed facts. This works because discovery and pretrial procedures sharpen claims/defenses LATER. The Court rejected treating pleading as "a game of skill in which one misstep by counsel may be decisive" — the goal is a decision on the merits.'),
      c(civpro,con,'How did this famous paragraph almost read differently? (behind the scenes)','Justice Black\'s original draft ended: "Under the Rules the best cause, not the cleverest pleader, is to prevail." Justice Harlan wrote Black a note asking him to cut the last two sentences — "I think that proper pleading still has its place in the sound administration of justice!" Black agreed: revised one sentence, dropped the other.'),
      c(civpro,con,'질문: Black이 그 문장들을 안 뺐다면 Conley 기준이 어떻게 달라졌을지.','It would have read as an even more absolute rejection of pleading formality, inviting more permissive lower-court readings. By softening it, the final opinion left room to argue "proper pleading still has its place" — Harlan\'s exact caveat — even while joining a decision moving standards toward leniency.'),

      c(civpro,swi,'Swierkiewicz v. Sorema — what happened?','Akos Swierkiewicz, 53, Hungarian native, was Senior VP/Chief Underwriting Officer at Sorema N.A. After ~6 years, CEO Chavel demoted him, transferred duties to a 32-year-old French national with 1 year experience (vs. Swierkiewicz\'s 26 years). Later isolated from meetings, sent a memo requesting severance, fired after refusing to resign. Sued under Title VII (national origin) and ADEA (age).'),
      c(civpro,swi,'Trace this case through the courts.','SDNY dismisses — finds no adequately pled prima facie case of discrimination. 2d Circuit AFFIRMS, applying its own precedent requiring a pled prima facie case. Supreme Court grants cert, UNANIMOUSLY REVERSES.'),
      c(civpro,swi,'What\'s the core holding?','An employment-discrimination complaint does NOT need to plead facts establishing a McDonnell Douglas prima facie case. The prima facie case is an EVIDENTIARY standard (what you must show later to raise an inference of discrimination) — not a PLEADING requirement. Rule 8(a) still just requires a short and plain statement giving fair notice.'),
      c(civpro,swi,'Why not require a prima facie case at the pleading stage?','McDonnell Douglas doesn\'t apply to every case — a plaintiff with DIRECT evidence can win without proving every prima facie element. Requiring every plaintiff to plead a prima facie case before discovery is incongruous — could force pleading MORE than ultimately needed if direct evidence later surfaces.\n\nPrima facie elements (evidentiary, later): protected group / job qualification / adverse action / inference-supporting circumstances.\nRule 8(a) (pleading, now): short & plain statement + fair notice. Nothing more.'),
      c(civpro,swi,'Why was Swierkiewicz\'s own complaint sufficient?','It easily satisfied Rule 8(a) — gave fair notice of the claims. Alleged termination based on national origin and age, detailed the events, gave relevant dates, included ages/nationalities of people involved. More than enough under notice pleading — no heightened standard for employment discrimination.'),
      c(civpro,swi,'질문 1: "나는 성별 때문에 채용 거부당했다"라는 한 줄만으로도 충분한지, Swierkiewicz는 실제로 어떤 추가 사실을 포함했는지.','Genuinely debated — some courts (D.C. Circuit in Sparrow) held even a bare statement can satisfy notice pleading. But Swierkiewicz\'s actual complaint went well beyond that — specific dates, named people with ages/nationalities, full sequence of events (demotion, isolation, memo, ultimatum). That extra context made his case easy, even though the holding suggests much less might suffice.'),
      c(civpro,swi,'질문 2: Leatherman 판례가 뭘 판시했었는지, 왜 규칙 개정 절차가 필요한지.','In Leatherman (1993), the Court unanimously held Rule 8 does not impose a heightened pleading standard on §1983 civil rights claims — courts can\'t invent stricter requirements through case law. Changes need the formal Rules Enabling Act amendment process, not judicial interpretation. Until then, courts rely on summary judgment and discovery control — not heightened pleading — to weed out weak claims. Swierkiewicz reaffirms this.'),

      c(civpro,big,'Weave all three cases into one story.','1944 Dioguardi — a district court clings to old code-pleading instinct, corrected by 2d Circuit.\n1957 Conley — the correction crystallizes into the "no set of facts" test at SCOTUS.\n2002 Swierkiewicz — decades later, courts still try to smuggle in heightened requirements (a prima facie case) — SCOTUS says no again.\n\nAll three: Rule 8(a) means what it says — short and plain, nothing more.'),
      c(civpro,big,'Heads-up — did this forgiving standard last forever? (not in this reading)','Not quite. In 2007/2009, Twombly and Iqbal introduced a "plausibility" standard that arguably raised the bar above Conley\'s "no set of facts" test. Not part of this reading — but useful context for why this trio is often called "the classical notice-pleading era."'),
    ]
  };
}

let state = loadState();

/* ============ NAV ============ */
let nav = {view:'home', courseId:null, caseId:null};
let study = {ids:[], index:0, flipped:false, title:'', color:'#1f4e8c', returnNav:null};
let reorderOn = false;
let shuffleOn = (localStorage.getItem('cho_cuecards_shuffle')==='1');
function shuffleArr(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function go(view, extra){ nav = Object.assign({view}, extra||{}); reorderOn = false; render(); window.scrollTo(0,0); }

/* ============ HELPERS ============ */
function courseOf(id){ return state.courses.find(x=>x.id===id); }
function caseOf(id){ return state.cases.find(x=>x.id===id); }
function casesIn(courseId){ return state.cases.filter(x=>x.courseId===courseId); }
function cardsIn(courseId, caseId){ return state.cards.filter(x=>x.courseId===courseId && (caseId==null || x.caseId===caseId)); }
function starredIn(courseId, caseId){ return cardsIn(courseId, caseId).filter(x=>x.starred); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function truncate(s, n){ s=(s||'').replace(/\s+/g,' ').trim(); return s.length>n ? s.slice(0,n).trim()+'…' : s; }

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 1800);
}

}

function computeSearchResultsHTML(rawQ){
  const q = (rawQ||'').trim().toLowerCase();
  if(!q) return `<div class="empty"><div class="big">🔍</div>과목·주제·카드 내용으로 검색할 수 있어요</div>`;

  const results = [];
  state.cases.forEach(cs=>{
    if(cs.name.toLowerCase().includes(q)){
      const co = courseOf(cs.courseId);
      if(co) results.push({type:'case', case:cs, course:co});
    }
  });
  state.cards.forEach(cd=>{
    if(cd.front.toLowerCase().includes(q) || cd.back.toLowerCase().includes(q)){
      const co = courseOf(cd.courseId);
      if(co) results.push({type:'card', card:cd, course:co});
    }
  });

  if(!results.length) return `<div class="empty"><div class="big">😕</div>"${esc(rawQ.trim())}"에 대한 결과가 없어요</div>`;

  return `<div class="section-title">${results.length}개 결과</div>` + results.map(r=>{
    if(r.type==='case'){
      const cnt = cardsIn(r.case.courseId, r.case.id).length;
      return `<div class="tile" data-goto-case="${r.case.courseId}|${r.case.id}">
        <div class="dot" style="background:${r.course.color}"></div>
        <div class="body"><div class="name">📁 ${esc(r.case.name)}</div><div class="meta">${esc(r.course.name)} · 주제 · 카드 ${cnt}개</div></div>
        <div class="chev">›</div>
      </div>`;
    }
    const cs = r.card.caseId ? caseOf(r.card.caseId) : null;
    const caseLabel = cs ? cs.name : '일반';
    return `<div class="tile" data-goto-case="${r.card.courseId}|${r.card.caseId||'__general__'}">
      <div class="dot" style="background:${r.course.color}"></div>
      <div class="body"><div class="name">${esc(truncate(r.card.front,60))}</div><div class="meta">${esc(r.course.name)} · ${esc(caseLabel)} — ${esc(truncate(r.card.back,50))}</div></div>
      <div class="chev">›</div>
    </div>`;
  }).join('');
}

/* ============ STUDY MODE ============ */
function startStudy(ids, title, color){
  if(!ids.length){ toast('학습할 카드가 없어요'); return; }
  const finalIds = shuffleOn ? shuffleArr(ids) : ids;
  const returnNav = Object.assign({}, nav);
  study = {ids:finalIds, index:0, flipped:false, title, color, returnNav};
  go('study');
}
function renderStudy(){
  if(!study.ids.length){ go('home'); return ''; }
  const card = state.cards.find(c=>c.id===study.ids[study.index]);
  if(!card){ study.ids.splice(study.index,1); if(study.index>=study.ids.length) study.index=Math.max(0,study.ids.length-1); return renderStudy(); }
  const pct = Math.round(((study.index+1)/study.ids.length)*100);

  return `
    <div class="topbar">
      <div class="back" id="btnExitStudy">✕</div>
      <div class="ttl">${esc(study.title)}<small>학습 모드</small></div>
      <div class="icon-btn" id="btnEditCurrentCard">✎</div>
    </div>
    <div class="content" style="--course-color:${study.color}">
      <div class="study-progress"><span>${study.index+1} / ${study.ids.length}</span><span>${pct}%</span></div>
      <div class="study-bar"><div class="fill" style="width:${pct}%"></div></div>

      <div class="stage">
        <div class="card3d ${study.flipped?'flipped':''}" id="card3d">
          <div class="face front">
            <div class="face-top"><span class="face-tag">FRONT</span><span class="star-btn ${card.starred?'on':''}" data-toggle-star="${card.id}">★</span></div>
            <div class="face-content"><div class="txt lookup-zone">${esc(card.front)}</div></div>
            <div class="tap-hint">👆 탭해서 뒤집기</div>
          </div>
          <div class="face back">
            <div class="face-top"><span class="face-tag">BACK</span><span class="star-btn ${card.starred?'on':''}" data-toggle-star="${card.id}">★</span></div>
            <div class="face-content"><div class="txt lookup-zone">${esc(card.back)}</div></div>
          </div>
        </div>
      </div>

      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" ${study.index===0?'disabled':''}>‹</button>
        <button class="flip-btn" id="flipBtn">${study.flipped?'질문 보기':'답 보기'}</button>
        <button class="nav-btn" id="nextBtn" ${study.index===study.ids.length-1?'disabled':''}>›</button>
      </div>
      <div class="review-row">
        <button class="rb-know" id="btnKnow">✓ 알겠어요 (즐겨찾기 해제)</button>
        <button class="rb-unsure" id="btnUnsure">☆ 다시 볼게요 (즐겨찾기)</button>
      </div>
    </div>
  `;
}

/* ============ SHEETS (add/edit forms) ============ */
function openSheet(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }

function sheetAddCourse(){
  openSheet(`
    <div class="sheet-hd"><h3>과목 추가</h3><div class="x" data-close>✕</div></div>
    <div class="field"><label>과목 이름</label><input type="text" id="fName" placeholder="예: Property"></div>
    <div class="field"><label>색상</label><div class="swatches" id="swatches"></div></div>
    <div class="sheet-btns"><button class="btn-primary" id="fSave" style="width:100%">추가</button></div>
  `);
  const sw = document.getElementById('swatches');
  let picked = COLOR_PRESETS[0];
  COLOR_PRESETS.forEach((col,i)=>{
    const d=document.createElement('div'); d.className='sw'+(i===0?' sel':''); d.style.background=col;
    d.onclick=()=>{ picked=col; sw.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); };
    sw.appendChild(d);
  });
  document.getElementById('fSave').onclick=()=>{
    const name = document.getElementById('fName').value.trim();
    if(!name){ toast('과목 이름을 입력해주세요'); return; }
    state.courses.push({id:uid(), name, color:picked});
    saveState(); closeSheet(); render(); toast('과목이 추가됐어요');
  };
}

  COLOR_PRESETS.forEach(col=>{
    const d=document.createElement('div'); d.className='sw'+(col===co.color?' sel':''); d.style.background=col;

    cs.name=name; saveState(); closeSheet(); render(); toast('저장됐어요');
  };

    if(confirm(`"${cs.name}"와 그 안의 카드를 모두 삭제할까요?`)){
      state.cards = state.cards.filter(x=>x.caseId!==caseId);
      state.cases = state.cases.filter(x=>x.id!==caseId);
      saveState(); closeSheet(); go('course', {courseId:cs.courseId}); toast('삭제됐어요');
    }
  };
}

    <div class="field"><label>뒷면 (답 / 설명)</label><textarea class="tall" id="fBack" placeholder="답변 내용..."></textarea></div>

/* ============ EVENTS ============ */
/* ============ DRAG REORDER ============ */
function enableDragReorder(containerId, onReorderIds){
  const container = document.getElementById(containerId);
  if(!container) return;

  container.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.addEventListener('pointerdown', (e)=>{
      const dragEl = handle.closest('[data-drag-id]');
      if(!dragEl) return;
      let startY = e.clientY;
      dragEl.classList.add('dragging');
      dragEl.style.position = 'relative';
      e.preventDefault();

      function onMove(e2){
        const dy = e2.clientY - startY;
        dragEl.style.transform = `translateY(${dy}px)`;
        const siblings = [...container.querySelectorAll('[data-drag-id]')];
        const idx = siblings.indexOf(dragEl);
        const dragRect = dragEl.getBoundingClientRect();
        const dragMid = dragRect.top + dragRect.height/2;
        for(let i=0;i<siblings.length;i++){
          if(siblings[i]===dragEl) continue;
          const r = siblings[i].getBoundingClientRect();
          const mid = r.top + r.height/2;
          if(i<idx && dragMid<mid){
            container.insertBefore(dragEl, siblings[i]);
            startY += (dragRect.height + 8);
            break;
          } else if(i>idx && dragMid>mid){
            container.insertBefore(dragEl, siblings[i].nextSibling);
            startY -= (dragRect.height + 8);
            break;
          }
        }
      }
      function onUp(){
        dragEl.style.transform = '';
        dragEl.style.position = '';
        dragEl.classList.remove('dragging');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        const newOrder = [...container.querySelectorAll('[data-drag-id]')].map(r=>r.dataset.dragId);
        onReorderIds(newOrder);
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}

function reorderCourses(newOrderIds){
  state.courses = newOrderIds.map(id=>state.courses.find(c=>c.id===id)).filter(Boolean);
  saveState();
}
function reorderCases(courseId, newOrderIds){
  const others = state.cases.filter(c=>c.courseId!==courseId);
  const reordered = newOrderIds.map(id=>state.cases.find(c=>c.id===id)).filter(Boolean);
  state.cases = others.concat(reordered);
  saveState();
}
function reorderCards(courseId, caseId, newOrderIds){
  const isGeneral = caseId==='__general__';
  const inScope = c => c.courseId===courseId && (isGeneral ? !c.caseId : c.caseId===caseId);
  const others = state.cards.filter(c=>!inScope(c));
  const reordered = newOrderIds.map(id=>state.cards.find(c=>c.id===id)).filter(Boolean);
  state.cards = others.concat(reordered);
  saveState();
}

/* ============ SMART IMPORT (merge by name, avoid duplicate courses/cases) ============ */
function mergeImportedData(data){
  const courseIdMap = {};
  let newCases = 0, newCards = 0;

  (data.courses||[]).forEach(ic=>{
    const existing = state.courses.find(c=>c.name===ic.name);
    if(existing){
      courseIdMap[ic.id] = existing.id;
    } else {
      state.courses.push({id: ic.id, name: ic.name, color: ic.color || COLOR_PRESETS[state.courses.length % COLOR_PRESETS.length]});
      courseIdMap[ic.id] = ic.id;
    }
  });

  const caseIdMap = {};
  (data.cases||[]).forEach(icase=>{
    const mappedCourseId = courseIdMap[icase.courseId] || icase.courseId;
    const existing = state.cases.find(c=>c.courseId===mappedCourseId && c.name===icase.name);
    if(existing){
      caseIdMap[icase.id] = existing.id;
    } else {
      state.cases.push({id: icase.id, courseId: mappedCourseId, name: icase.name});
      caseIdMap[icase.id] = icase.id;
      newCases++;
    }
  });

  (data.cards||[]).forEach(icard=>{
    const mappedCourseId = courseIdMap[icard.courseId] || icard.courseId;
    const mappedCaseId = icard.caseId ? (caseIdMap[icard.caseId] || icard.caseId) : null;
    const dup = state.cards.find(c=>c.courseId===mappedCourseId && c.caseId===mappedCaseId && c.front===icard.front);
    if(!dup){
      state.cards.push({id: icard.id, courseId: mappedCourseId, caseId: mappedCaseId, front: icard.front, back: icard.back, starred:false, createdAt: Date.now()});
      newCards++;
    }
  });

  return {newCases, newCards};
}

/* ============ DICTIONARY LOOKUP ============ */
let lastSelectionText = '';
let selDebounce = null;
document.addEventListener('selectionchange', ()=>{
  clearTimeout(selDebounce);
  selDebounce = setTimeout(()=>{
    const btn = document.getElementById('lookupBtn');
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || sel.rangeCount===0){ btn.classList.remove('show'); return; }
    const text = sel.toString().trim();
    if(!text || text.length>60){ btn.classList.remove('show'); return; }
    const anchorNode = sel.anchorNode;
    const el = anchorNode && (anchorNode.nodeType===3 ? anchorNode.parentElement : anchorNode);
    if(!el || !el.closest('.lookup-zone')){ btn.classList.remove('show'); return; }
    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    if(rect.width===0 && rect.height===0){ btn.classList.remove('show'); return; }
    lastSelectionText = text;
    btn.style.left = Math.max(8, Math.min(window.innerWidth-150, rect.left + rect.width/2 - 65)) + 'px';
    btn.style.top = Math.max(8, rect.top - 44 + window.scrollY) + 'px';
    btn.classList.add('show');
  }, 150);
});

document.getElementById('lookupBtn').addEventListener('click', ()=>{
  document.getElementById('lookupBtn').classList.remove('show');
  openLookup(lastSelectionText);
});

async function openLookup(text){
  document.getElementById('lookupSheet').innerHTML = `
    <div class="sheet-hd"><h3>사전</h3><div class="x" id="lookupClose">✕</div></div>
    <div class="lookup-loading"><div class="spin"></div>찾아보고 있어요...</div>
  `;
  document.getElementById('lookupOverlay').classList.add('show');
  document.getElementById('lookupClose').onclick = ()=> document.getElementById('lookupOverlay').classList.remove('show');

  const isPhrase = /\s/.test(text);
  let defData = null, translation = null;

  if(!isPhrase){
    try{
      const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(text));
      if(res.ok){ const json = await res.json(); defData = json[0]; }
    }catch(e){}
  }
  try{
    const tres = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|ko');
    if(tres.ok){ const tjson = await tres.json(); translation = tjson.responseData && tjson.responseData.translatedText; }
  }catch(e){}

  renderLookupResult(text, defData, translation);
}

function renderLookupResult(text, defData, translation){
  let html = `<div class="sheet-hd"><h3>사전</h3><div class="x" id="lookupClose">✕</div></div>`;
  html += `<div class="lookup-sheet-hd"><div><div class="lookup-word">${esc(text)}</div>`;
  if(defData && defData.phonetic){ html += `<div class="lookup-phon">${esc(defData.phonetic)}</div>`; }
  html += `</div></div>`;

  if(defData && defData.meanings && defData.meanings.length){
    html += `<div class="lookup-sec"><div class="lbl">ENGLISH DEFINITION</div>`;
    defData.meanings.slice(0,3).forEach(m=>{
      html += `<div class="lookup-pos">${esc(m.partOfSpeech||'')}</div>`;
      (m.definitions||[]).slice(0,2).forEach(d=>{
        html += `<div class="lookup-def">${esc(d.definition)}</div>`;
      });
    });
    html += `</div>`;
  } else if(!/\s/.test(text)){
    html += `<div class="lookup-sec"><div class="lookup-error">영어 사전에서 찾을 수 없어요.</div></div>`;
  }

  html += `<div class="lookup-sec"><div class="lbl">한국어</div>`;
  if(translation){ html += `<div class="lookup-kr">${esc(translation)}</div>`; }
  else { html += `<div class="lookup-error">번역을 가져올 수 없어요.</div>`; }
  html += `</div>`;

  document.getElementById('lookupSheet').innerHTML = html;
  document.getElementById('lookupClose').onclick = ()=> document.getElementById('lookupOverlay').classList.remove('show');
}
document.getElementById('lookupOverlay').addEventListener('click', (e)=>{ if(e.target.id==='lookupOverlay') document.getElementById('lookupOverlay').classList.remove('show'); });

function bindGlobalEvents(){
  const app = document.getElementById('app');

  const on = (id, fn) => { const el=document.getElementById(id); if(el) el.onclick = fn; };

  on('btnSettings', ()=> go('settings'));
  on('btnSearch', ()=> go('search', {query:''}));
  on('btnBack', ()=>{
    if(nav.view==='course') go('home');
    else if(nav.view==='case') go('course', {courseId:nav.courseId});
    else if(nav.view==='settings') go('home');
    else if(nav.view==='search') go('home');
  });
  on('btnAddCourse', ()=> sheetAddCourse());
  on('btnAddCase', ()=> sheetAddCase(nav.courseId));
  on('btnAddCard', ()=> sheetAddCard(nav.courseId, nav.caseId));
  on('btnEditCourse', ()=> sheetEditCourse(nav.courseId));
  on('btnEditCase', ()=> sheetEditCase(nav.caseId));

  on('btnReorderHome', ()=>{ reorderOn=true; render(); });
  on('btnDoneReorderHome', ()=>{ reorderOn=false; render(); });
  on('btnReorderCourse', ()=>{ reorderOn=true; render(); });
  on('btnDoneReorderCourse', ()=>{ reorderOn=false; render(); });
  on('btnReorderCase', ()=>{ reorderOn=true; render(); });
  on('btnDoneReorderCase', ()=>{ reorderOn=false; render(); });
  on('shuffleToggle', ()=>{
    shuffleOn = !shuffleOn;
    try{ localStorage.setItem('cho_cuecards_shuffle', shuffleOn?'1':'0'); }catch(e){}
    render();
  });

  if(reorderOn){
    if(nav.view==='home') enableDragReorder('reorderListHome', (ids)=> reorderCourses(ids));
    else if(nav.view==='course') enableDragReorder('reorderListCourse', (ids)=> reorderCases(nav.courseId, ids));
    else if(nav.view==='case') enableDragReorder('reorderListCase', (ids)=> reorderCards(nav.courseId, nav.caseId, ids));
  }

  if(nav.view==='search'){
    const input = document.getElementById('searchInput');
    const results = document.getElementById('searchResults');
    const bindResultClicks = ()=>{
      results.querySelectorAll('[data-goto-case]').forEach(el=>{
        el.onclick = ()=>{
          const [courseId, caseId] = el.dataset.gotoCase.split('|');
          go('case', {courseId, caseId});
        };
      });
    };
    results.innerHTML = computeSearchResultsHTML(nav.query);
    bindResultClicks();
    input.focus();
    const v = input.value; input.value=''; input.value=v;
    input.addEventListener('input', ()=>{
      nav.query = input.value;
      results.innerHTML = computeSearchResultsHTML(nav.query);
      bindResultClicks();
    });
  }

  on('btnStudyAll', ()=>{ const co=courseOf(nav.courseId); startStudy(cardsIn(co.id).map(x=>x.id), co.name+' — 전체', co.color); });
  on('btnStudyStar', ()=>{ const co=courseOf(nav.courseId); startStudy(starredIn(co.id).map(x=>x.id), co.name+' — 즐겨찾기', co.color); });
  on('btnStudyCase', ()=>{
    const co=courseOf(nav.courseId); const isGeneral=nav.caseId==='__general__';
    const cs = isGeneral?null:caseOf(nav.caseId);
    const cards = isGeneral ? cardsIn(co.id).filter(x=>!x.caseId) : cardsIn(co.id, cs.id);
    startStudy(cards.map(x=>x.id), (isGeneral?'일반':cs.name), co.color);
  });
  on('btnStudyCaseStar', ()=>{
    const co=courseOf(nav.courseId); const isGeneral=nav.caseId==='__general__';
    const cs = isGeneral?null:caseOf(nav.caseId);
    const cards = (isGeneral ? cardsIn(co.id).filter(x=>!x.caseId) : cardsIn(co.id, cs.id)).filter(x=>x.starred);
    startStudy(cards.map(x=>x.id), (isGeneral?'일반':cs.name)+' — 즐겨찾기', co.color);
  });
  on('btnStudyAllGlobal', ()=> startStudy(state.cards.map(x=>x.id), '전체 과목', '#20242b'));
  on('btnStudyStarGlobal', ()=> startStudy(state.cards.filter(x=>x.starred).map(x=>x.id), '즐겨찾기 전체', '#e0a527'));

  on('btnExitStudy', ()=>{
    if(study.returnNav && study.returnNav.view && study.returnNav.view!=='study'){ nav = study.returnNav; render(); }
    else go('home');
  });
  on('flipBtn', ()=>{ study.flipped=!study.flipped; render(); });
  on('prevBtn', ()=>{ if(study.index>0){ study.index--; study.flipped=false; render(); } });
  on('nextBtn', ()=>{ if(study.index<study.ids.length-1){ study.index++; study.flipped=false; render(); } });
  on('btnKnow', ()=>{
    const card = state.cards.find(c=>c.id===study.ids[study.index]);
    if(card){ card.starred=false; saveState(); }
    if(study.index<study.ids.length-1){ study.index++; study.flipped=false; } 
    render();
  });
  on('btnUnsure', ()=>{
    const card = state.cards.find(c=>c.id===study.ids[study.index]);
    if(card){ card.starred=true; saveState(); }
    if(study.index<study.ids.length-1){ study.index++; study.flipped=false; }
    render();
  });
  on('btnEditCurrentCard', ()=>{ const card = state.cards.find(c=>c.id===study.ids[study.index]); if(card) sheetEditCard(card.id); });

  on('btnExport', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='cuecards_backup_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('백업 파일을 다운로드했어요');
  });
  on('btnImportTrigger', ()=> document.getElementById('importFile').click());
  const importFile = document.getElementById('importFile');
  if(importFile) importFile.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!data.courses || !data.cases || !data.cards) throw new Error('bad format');
        const summary = mergeImportedData(data);
        saveState(); render();
        toast(`가져왔어요 — 새 카드 ${summary.newCards}개, 새 주제 ${summary.newCases}개`);
      }catch(err){ toast('파일을 읽을 수 없어요 — 형식을 확인해주세요'); }
    };
    reader.readAsText(file);
  };
  on('btnResetAll', ()=>{
    if(confirm('정말 모든 과목과 카드를 삭제할까요? 이 작업은 되돌릴 수 없어요. 먼저 백업을 내보내는 걸 권장해요.')){
      state = {courses:[], cases:[], cards:[]};
      saveState(); go('home'); toast('전체 초기화됐어요');
    }
  });

  // course/case tile taps
  app.querySelectorAll('[data-open-course]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-edit-course]')) return;
      go('course', {courseId: el.dataset.openCourse});
    });
  });
  app.querySelectorAll('[data-edit-course]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); sheetEditCourse(el.dataset.editCourse); });
  });
  app.querySelectorAll('[data-open-case]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-edit-case]')) return;
      go('case', {courseId: nav.courseId, caseId: el.dataset.openCase});
    });
  });
  app.querySelectorAll('[data-edit-case]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); sheetEditCase(el.dataset.editCase); });
  });

  // card rows
  app.querySelectorAll('[data-toggle-star]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const cd = state.cards.find(x=>x.id===el.dataset.toggleStar);
      if(cd){ cd.starred=!cd.starred; saveState(); render(); }
    });
  });
  app.querySelectorAll('[data-edit-card]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); sheetEditCard(el.dataset.editCard); });
  });
  app.querySelectorAll('[data-preview]').forEach(el=>{
    el.addEventListener('click', ()=> sheetEditCard(el.dataset.preview));
  });

  // card flip (study mode)
  const c3d = document.getElementById('card3d');
  if(c3d){
    let touchStartX=null, touchStartY=null;
    c3d.addEventListener('click', (e)=>{
      if(e.target.closest('.star-btn')) return;
      study.flipped=!study.flipped; render();
    });
    c3d.addEventListener('touchstart', (e)=>{ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; }, {passive:true});
    c3d.addEventListener('touchend', (e)=>{
      if(touchStartX===null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
        if(dx < 0 && study.index < study.ids.length-1){ study.index++; study.flipped=false; render(); }
        else if(dx > 0 && study.index > 0){ study.index--; study.flipped=false; render(); }
      }
      touchStartX=null; touchStartY=null;
    }, {passive:true});
    // star buttons inside card faces
    c3d.querySelectorAll('[data-toggle-star]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const cd = state.cards.find(x=>x.id===el.dataset.toggleStar);
        if(cd){ cd.starred=!cd.starred; saveState(); render(); }
      });
    });
  }

  // overlay close
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeSheet(); };
  app.querySelectorAll('[data-close]').forEach(el=> el.onclick = closeSheet);
  const sheetEl = document.getElementById('sheet');
  if(sheetEl) sheetEl.querySelectorAll('[data-close]').forEach(el=> el.onclick = closeSheet);
}
document.getElementById('sheet').addEventListener('click', (e)=>{
  if(e.target.closest('[data-close]')) closeSheet();
});

document.addEventListener('keydown', (e)=>{
  const tag = document.activeElement && document.activeElement.tagName;
  if(tag==='TEXTAREA' || tag==='INPUT') return;
  if(nav.view!=='study') return;
  if(e.key==='ArrowRight'){ document.getElementById('nextBtn')?.click(); }
  if(e.key==='ArrowLeft'){ document.getElementById('prevBtn')?.click(); }
  if(e.key===' '){ e.preventDefault(); document.getElementById('flipBtn')?.click(); }
});

render();
</script>
